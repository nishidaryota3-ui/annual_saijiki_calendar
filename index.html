<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>年間歳時記・天体カレンダー (Annual Saijiki Celestial Calendar)</title>
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
    <div id="canvas-container">
        <svg id="annual-wheel-svg" viewBox="0 0 2000 2000" data-lod="lod-macro">
            <defs id="annual-defs"></defs>
            <g id="annual-master-group"></g>
            <g id="layer-annual-hands"></g>
        </svg>
    </div>

    <!-- 設定・定数 -->
    <script src="js/config/constants.js?v=2"></script>
    <script src="js/config/default-settings.js?v=2"></script>

    <!-- 歳時記 21,372語 完全データベース ＆ 観察記録 -->
    <script src="js/data/saijiki-complete-db.js?v=2"></script>
    <script src="js/data/saijiki-database.js?v=2"></script>
    <script src="js/data/user-events.js?v=2"></script>

    <!-- 天体計算エンジン -->
    <script src="js/astronomy/meeus.js?v=2"></script>
    <script src="js/astronomy/ephemeris.js?v=2"></script>

    <!-- SVG描画エンジン -->
    <script src="js/draw/svg-utils.js?v=2"></script>
    <script src="js/draw/draw-annual-wheel.js?v=2"></script>
    <script src="js/draw/draw-annual-hands.js?v=2"></script>

    <!-- A0/A1 印刷用高精度ベクター出力エンジン -->
    <script src="js/export/print-exporter.js?v=2"></script>

    <!-- UI & モーダル -->
    <script src="js/ui/annual-navbar.js?v=2"></script>
    <script src="js/ui/annual-modals.js?v=2"></script>
    <script src="js/ui/design-panel.js?v=2"></script>

    <!-- メイン統括 -->
    <script src="main.js?v=5"></script>
</body>
</html>
